<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="查看并下载生成的登机牌 PNG。" />
    <meta name="theme-color" content="#07100a" />
    <meta name="apple-mobile-web-app-title" content="登机牌生成器" />
    <title>登机牌生成结果</title>
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" href="./favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body class="result-page">
    <main class="result-shell">
      <header class="result-header">
        <div>
          <div class="eyebrow">BOARDING PASS STUDIO</div>
          <h1>登机牌已生成</h1>
          <p class="intro">请确认登机牌内容，然后下载 PNG 图片。</p>
        </div>
        <div class="result-actions">
          <a class="button-link secondary" href="./index.html">返回修改</a>
          <button id="result-download" class="primary" type="button">下载 PNG</button>
          <button id="screenshot-download" class="primary screenshot-button" type="button">下载截图</button>
        </div>
      </header>

      <div id="result-error" class="result-error" hidden>
        <h2>没有找到可生成的数据</h2>
        <p></p>
        <a class="button-link primary" href="./index.html">返回填写</a>
      </div>

      <section id="result-content" class="result-content" aria-label="生成的登机牌">
        <div class="result-canvas-wrap">
          <canvas id="result-canvas" width="1206" height="1609">您的浏览器不支持 Canvas。</canvas>
        </div>
        <aside class="result-meta">
          <span class="status-pill"><i></i>IATA BCBP · QR VERSION 7</span>
          <h2 id="result-route"></h2>
          <dl>
            <div><dt>乘机人</dt><dd id="result-passenger"></dd></div>
            <div><dt>航班</dt><dd id="result-flight"></dd></div>
            <div><dt>日期</dt><dd id="result-date"></dd></div>
            <div><dt>截图时间</dt><dd id="result-time"></dd></div>
          </dl>
          <details class="bcbp-details">
            <summary>查看 BCBP 明文</summary>
            <code id="result-bcbp"></code>
            <p>二维码固定使用 Version 7，因此具有与 demo 一致的六个可见对齐定位方块。</p>
          </details>
          <p class="legal-note">仅用于设计样机与开发测试，不是有效旅行凭证。</p>
        </aside>
      </section>
      <canvas id="screenshot-canvas" width="1280" height="2781" hidden></canvas>
    </main>
    <script type="module" src="./src/result.js"></script>
  </body>
</html>
